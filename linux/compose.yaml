name: ${COMPOSE_PROJECT_NAME:-evsunucu}

services:
  mail:
    image: "${MAIL_IMAGE:-docker.io/mailserver/docker-mailserver:15.1.0}"
    hostname: "${MAIL_HOSTNAME:?MAIL_HOSTNAME .env içinde zorunludur}"
    domainname: "${MAIL_DOMAIN:?MAIL_DOMAIN .env içinde zorunludur}"
    env_file:
      - ./docker-data/dms/mailserver.env
    environment:
      OVERRIDE_HOSTNAME: "${MAIL_HOSTNAME:?MAIL_HOSTNAME .env içinde zorunludur}"
      SSL_TYPE: "${MAIL_SSL_TYPE:-self-signed}"
      ENABLE_RSPAMD: "1"
      ENABLE_CLAMAV: "0"
      ENABLE_FAIL2BAN: "0"
      ENABLE_POSTGREY: "0"
      SPOOF_PROTECTION: "1"
    ports:
      - "${MAIL_BIND_IP:-127.0.0.1}:${SMTP_PORT_BIND:-25}:25"
      - "${MAIL_BIND_IP:-127.0.0.1}:${SUBMISSION_PORT_BIND:-587}:587"
      - "${MAIL_BIND_IP:-127.0.0.1}:${IMAPS_PORT_BIND:-993}:993"
    volumes:
      - ./docker-data/dms/mail-data:/var/mail
      - ./docker-data/dms/mail-state:/var/mail-state
      - ./docker-data/dms/mail-logs:/var/log/mail
      - ./docker-data/dms/config:/tmp/docker-mailserver
    restart: unless-stopped
    stop_grace_period: 1m
    networks:
      mailnet:
        aliases:
          - "${MAIL_HOSTNAME:?MAIL_HOSTNAME .env içinde zorunludur}"

  db:
    image: "${DB_IMAGE:-mariadb:11.4}"
    env_file:
      - ./docker-data/roundcube/db.env
    volumes:
      - ./docker-data/roundcube/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 1m
    networks:
      - mailnet

  roundcube:
    image: "${ROUNDCUBE_IMAGE:-roundcube/roundcubemail:1.7.2-apache}"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    env_file:
      - ./docker-data/roundcube/roundcube.env
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: "tls://${MAIL_HOSTNAME:?MAIL_HOSTNAME .env içinde zorunludur}"
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: "tls://${MAIL_HOSTNAME:?MAIL_HOSTNAME .env içinde zorunludur}"
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_REQUEST_PATH: "/webmail/"
    volumes:
      - ./docker-data/roundcube/config:/var/roundcube/config
      - ./docker-data/roundcube/temp:/tmp/roundcube-temp
    restart: unless-stopped
    networks:
      - mailnet
      - webnet

  web:
    image: "${NGINX_IMAGE:-nginx:1.27-alpine}"
    depends_on:
      roundcube:
        condition: service_started
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8088}:80"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./docker-data/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - webnet

networks:
  mailnet:
    driver: bridge
  webnet:
    internal: true
